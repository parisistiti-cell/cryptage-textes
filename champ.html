<script>
  function strToBytes(str) {
    const bytes = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i) & 0xFF;
    return bytes;
  }
  function bytesToBase64(bytes) {
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function base64ToBytes(b64) {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function encodeText(text, key) {
    const textBytes = strToBytes(text);
    const keyBytes = strToBytes(key);
    const out = new Uint8Array(textBytes.length + 1);
    for (let i = 0; i < textBytes.length; i++) out[i] = textBytes[i] ^ keyBytes[i % keyBytes.length];
    out[textBytes.length] = 0x3B;
    return bytesToBase64(out);
  }
  function decodeText(cipherB64, key) {
    const allBytes = base64ToBytes(cipherB64);
    const cipherBytes = allBytes.slice(0, allBytes.length - 1);
    const keyBytes = strToBytes(key);
    let result = "";
    for (let i = 0; i < cipherBytes.length; i++) {
      result += String.fromCharCode(cipherBytes[i] ^ keyBytes[i % keyBytes.length]);
    }
    return result;
  }
  function extractCipherFromInput(text) {
    const cleaned = text.replace(/\s+/g, "");
    return cleaned.length > 0 ? cleaned : text.trim();
  }
  const DOUBLE_MARKER = "TC2::";
  function decodeCipherText(rawText, key) {
    const cipher = extractCipherFromInput(rawText);
    const decoded = decodeText(cipher, key);
    if (decoded.startsWith(DOUBLE_MARKER)) {
      return { text: decodeText(decoded.slice(DOUBLE_MARKER.length), key), wasDouble: true };
    }
    return { text: decoded, wasDouble: false };
  }
  function isLikelyCipherText(rawText) {
    const trimmed = rawText.trim();
    if (!trimmed) return false;
    const candidate = extractCipherFromInput(rawText);
    if (!candidate || candidate.length < 8 || candidate.length % 4 !== 0) return false;
    if (!/^[A-Za-z0-9+/]+={0,2}$/.test(candidate)) return false;
    try { base64ToBytes(candidate); return true; } catch (e) { return false; }
  }

  const tabBtnText = document.getElementById('tabBtnText');
  const tabBtnResult = document.getElementById('tabBtnResult');
  const tabBodyText = document.getElementById('tabBodyText');
  const tabBodyResult = document.getElementById('tabBodyResult');

  function switchTab(tab) {
    const isText = tab === 'text';
    tabBodyText.style.display = isText ? 'block' : 'none';
    tabBodyResult.style.display = isText ? 'none' : 'block';
    tabBtnText.classList.toggle('active', isText);
    tabBtnResult.classList.toggle('active', !isText);
  }
  tabBtnText.addEventListener('click', () => switchTab('text'));
  tabBtnResult.addEventListener('click', () => switchTab('result'));

  const keyField = document.getElementById('keyField');
  const inputText = document.getElementById('inputText');
  const resultText = document.getElementById('resultText');
  const statusMsg = document.getElementById('statusMsg');
  const inputLockHint = document.getElementById('inputLockHint');

  function updateInputLockState() {
    const locked = isLikelyCipherText(inputText.value);
    inputText.readOnly = locked;
    inputLockHint.textContent = locked ? "🔒 Texte codé détecté : zone verrouillée." : "";
  }
  updateInputLockState();

  let lastResultType = null;
  function runProcess(mode) {
    const key = keyField.value;
    const text = inputText.value;
    statusMsg.textContent = "";
    if (!key) { statusMsg.textContent = "⚠️ Veuillez entrer une clé."; return; }
    if (!text) { statusMsg.textContent = "⚠️ Veuillez entrer un texte."; return; }
    try {
      if (mode === 'encode') {
        resultText.value = encodeText(text, key);
        statusMsg.textContent = "✅ Texte codé.";
        lastResultType = 'coded';
      } else if (mode === 'doubleEncode') {
        const level1 = encodeText(text, key);
        resultText.value = encodeText(DOUBLE_MARKER + level1, key);
        statusMsg.textContent = "✅ Texte codé deux fois.";
        lastResultType = 'coded';
      } else {
        const { text: finalText, wasDouble } = decodeCipherText(text, key);
        resultText.value = finalText;
        statusMsg.textContent = wasDouble ? "✅ Texte décodé (double)." : "✅ Texte décodé.";
        lastResultType = 'decoded';
      }
      resultText.readOnly = (lastResultType === 'coded');
      switchTab('result');
    } catch (e) {
      statusMsg.textContent = "❌ Erreur : clé ou texte invalide.";
      resultText.value = "";
    }
  }

  document.getElementById('btnCoder').addEventListener('click', () => runProcess('encode'));
  document.getElementById('btnDoubleCoder').addEventListener('click', () => runProcess('doubleEncode'));
  document.getElementById('btnDecoder').addEventListener('click', () => runProcess('decode'));
  document.getElementById('btnBackToText').addEventListener('click', () => switchTab('text'));

  const toggleKeyVisibility = document.getElementById('toggleKeyVisibility');
  toggleKeyVisibility.addEventListener('click', () => {
    const isVisible = keyField.type === 'text';
    keyField.type = isVisible ? 'password' : 'text';
    toggleKeyVisibility.textContent = isVisible ? '👁️' : '🙈';
  });

  const helpOverlay = document.getElementById('helpOverlay');
  document.getElementById('btnHelp').addEventListener('click', () => helpOverlay.classList.add('open'));
  document.getElementById('helpClose').addEventListener('click', () => helpOverlay.classList.remove('open'));

  document.getElementById('btnCopyResult').addEventListener('click', async () => {
    if (!resultText.value) return;
    await navigator.clipboard.writeText(resultText.value);
    document.getElementById('saveStatus').textContent = "✅ Copié !";
  });

  document.getElementById('btnSave').addEventListener('click', () => {
    if (!resultText.value) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text(resultText.value, 10, 10, { maxWidth: 190 });
    doc.save("titicrypt-resultat.pdf");
  });
</script>
